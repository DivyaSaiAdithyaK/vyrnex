<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustVault — secure documents</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#38bdf8;--bad:#f87171;--ok:#4ade80}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#475569;--ac:#0369a1;--bad:#b91c1c;--ok:#15803d}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--card);flex-wrap:wrap}header b{font-size:18px;margin-right:auto}
main{max-width:1100px;margin:20px auto;padding:0 16px}.card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:16px}
input,select,button{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid var(--mut);background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:3px 8px}button.d{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid #64748b44;white-space:nowrap}.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.tab.on{outline:2px solid var(--ac)}h3{margin:0 0 10px}
</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
